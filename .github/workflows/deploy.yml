# Pubblicazione: parte quando la CI è verde su main. Prima lo schema (migrazioni e cataloghi su Neon),
# poi il codice (deploy hook di Render sul commit esatto). Vercel pubblica il frontend da solo al push su main.
# Le migrazioni devono essere compatibili con la versione del server ancora in esecuzione.
name: Deploy

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
      - uses: actions/setup-node@v7
        with: { node-version: 24, cache: npm }
      - run: npm ci --no-audit --no-fund
      - name: Migrazioni
        run: npm run migra -w @dnd/api
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          NODE_ENV: production
      - name: Cataloghi ufficiali
        run: npm run semina -w @dnd/api
        env:
          DATABASE_URL: ${{ secrets.PRODUCTION_DATABASE_URL }}
          NODE_ENV: production
      - name: Deploy dell'API su Render
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          test -n "$HOOK" || { echo "Manca il secret RENDER_DEPLOY_HOOK_URL"; exit 1; }
          curl -fsS -X POST "${HOOK}&ref=${SHA}" -o /dev/null
          echo "Deploy di $SHA avviato su Render."
