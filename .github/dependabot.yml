version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule: { interval: weekly }
    target-branch: sviluppo
    groups:
      dipendenze:
        patterns: ["*"]
        update-types: [minor, patch]
  - package-ecosystem: github-actions
    directory: /
    schedule: { interval: weekly }
    target-branch: sviluppo
